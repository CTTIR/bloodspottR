<svg width="500" height="580" viewBox="0 0 500 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ivory tissue-section background -->
    <linearGradient id="bgblood" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%"  stop-color="#F7EFE6"/>
      <stop offset="100%" stop-color="#EAD9C8"/>
    </linearGradient>
    <!-- Erythrocyte radial (biconcave look) -->
    <radialGradient id="rbc" cx="42%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#B4232E"/>
      <stop offset="55%"  stop-color="#8E1B24"/>
      <stop offset="100%" stop-color="#6B121A"/>
    </radialGradient>
    <radialGradient id="rbcDimple" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6B121A" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#6B121A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6B121A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="hexblood">
      <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"/>
    </clipPath>
  </defs>

  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145" fill="url(#bgblood)"/>

  <g clip-path="url(#hexblood)">

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- PALE TISSUE SECTION — soft eosin-stained field texture  -->
    <!-- faint irregular blobs in muted rose/tan                 -->
    <!-- ══════════════════════════════════════════════════════ -->
    <g opacity="0.5">
      <path d="M 80,150 Q 160,120 240,160 Q 320,200 300,270 Q 260,320 180,300 Q 90,280 70,210 Z"
        fill="#E8C4B8" opacity="0.45"/>
      <path d="M 300,160 Q 400,140 440,210 Q 450,290 380,320 Q 320,330 310,260 Q 300,210 300,160 Z"
        fill="#E5BBAe" opacity="0.4"/>
      <path d="M 120,300 Q 220,290 300,330 Q 360,370 300,420 Q 210,450 140,410 Q 90,360 120,300 Z"
        fill="#EAC9BC" opacity="0.4"/>
    </g>

    <!-- faint cell-boundary reticulation (tissue architecture) -->
    <g stroke="#C9A48F" stroke-width="0.7" fill="none" opacity="0.4">
      <path d="M 90,200 Q 140,180 190,205 Q 240,230 210,270"/>
      <path d="M 210,270 Q 180,320 230,350"/>
      <path d="M 260,180 Q 310,200 300,250 Q 290,300 330,330"/>
      <path d="M 150,320 Q 200,340 250,320"/>
      <path d="M 330,220 Q 380,240 370,290"/>
    </g>
    <!-- scattered faint nuclei (haematoxylin dots) -->
    <g fill="#7A4A6A" opacity="0.35">
      <circle cx="130" cy="215" r="3"/>
      <circle cx="205" cy="255" r="2.6"/>
      <circle cx="285" cy="210" r="3"/>
      <circle cx="340" cy="285" r="2.6"/>
      <circle cx="180" cy="330" r="2.8"/>
      <circle cx="255" cy="345" r="2.4"/>
      <circle cx="150" cy="270" r="2.4"/>
      <circle cx="315" cy="330" r="2.6"/>
    </g>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- MICROSCOPE MOTIF — subtle, top area                     -->
    <!-- objective lens barrel pointing down over the field      -->
    <!-- rendered in burgundy line, understated                  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <g stroke="#6B121A" fill="none" opacity="0.22" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <!-- objective barrel -->
      <path d="M 224,120 L 276,120 L 268,150 L 258,164 L 242,164 L 232,150 Z"/>
      <!-- nosepiece band -->
      <line x1="222" y1="132" x2="278" y2="132"/>
      <!-- light cone from lens to field -->
      <path d="M 242,164 L 210,206 M 258,164 L 290,206"/>
    </g>
    <!-- lens glint -->
    <ellipse cx="250" cy="158" rx="9" ry="4" fill="#6B121A" opacity="0.14"/>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- FINE MEASUREMENT OUTLINES — dashed circles around some   -->
    <!-- erythrocytes, with diameter ticks (the "quantify" idea)  -->
    <!-- ══════════════════════════════════════════════════════ -->
    <g stroke="#6B121A" fill="none" opacity="0.55">
      <circle cx="250" cy="262" r="42" stroke-width="1.4" stroke-dasharray="5 4"/>
      <!-- diameter tick line -->
      <line x1="208" y1="262" x2="292" y2="262" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>
      <line x1="208" y1="256" x2="208" y2="268" stroke-width="1.2"/>
      <line x1="292" y1="256" x2="292" y2="268" stroke-width="1.2"/>
    </g>
    <g stroke="#6B121A" fill="none" opacity="0.4">
      <circle cx="340" cy="245" r="26" stroke-width="1.2" stroke-dasharray="4 3"/>
      <circle cx="168" cy="330" r="24" stroke-width="1.2" stroke-dasharray="4 3"/>
    </g>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- ERYTHROCYTES — crimson biconcave discs (the blood spot)  -->
    <!-- clustered central spot + scattered singles               -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- central cluster (the focal blood spot) -->
    <g>
      <ellipse cx="250" cy="262" rx="30" ry="27" fill="url(#rbc)"/>
      <ellipse cx="250" cy="262" rx="15" ry="13" fill="url(#rbcDimple)"/>
      <ellipse cx="242" cy="252" rx="8" ry="4" fill="#D46A6A" opacity="0.4"/>

      <ellipse cx="212" cy="248" rx="24" ry="21" fill="url(#rbc)"/>
      <ellipse cx="212" cy="248" rx="12" ry="10" fill="url(#rbcDimple)"/>
      <ellipse cx="206" cy="240" rx="6" ry="3" fill="#D46A6A" opacity="0.4"/>

      <ellipse cx="286" cy="252" rx="25" ry="22" fill="url(#rbc)"/>
      <ellipse cx="286" cy="252" rx="12" ry="10" fill="url(#rbcDimple)"/>
      <ellipse cx="280" cy="244" rx="6" ry="3" fill="#D46A6A" opacity="0.4"/>

      <ellipse cx="232" cy="292" rx="23" ry="20" fill="url(#rbc)"/>
      <ellipse cx="232" cy="292" rx="11" ry="9" fill="url(#rbcDimple)"/>

      <ellipse cx="274" cy="294" rx="24" ry="21" fill="url(#rbc)"/>
      <ellipse cx="274" cy="294" rx="12" ry="10" fill="url(#rbcDimple)"/>
      <ellipse cx="268" cy="286" rx="6" ry="3" fill="#D46A6A" opacity="0.4"/>
    </g>

    <!-- scattered singles -->
    <g>
      <ellipse cx="340" cy="245" rx="20" ry="17" fill="url(#rbc)"/>
      <ellipse cx="340" cy="245" rx="10" ry="8" fill="url(#rbcDimple)"/>

      <ellipse cx="168" cy="330" rx="19" ry="16" fill="url(#rbc)"/>
      <ellipse cx="168" cy="330" rx="9" ry="7" fill="url(#rbcDimple)"/>

      <ellipse cx="150" cy="212" rx="16" ry="14" fill="url(#rbc)"/>
      <ellipse cx="150" cy="212" rx="8" ry="6" fill="#6B121A" opacity="0.4"/>

      <ellipse cx="322" cy="322" rx="17" ry="15" fill="url(#rbc)"/>
      <ellipse cx="322" cy="322" rx="8" ry="6" fill="#6B121A" opacity="0.4"/>

      <ellipse cx="300" cy="185" rx="14" ry="12" fill="url(#rbc)"/>
      <ellipse cx="300" cy="185" rx="7" ry="5" fill="#6B121A" opacity="0.4"/>

      <ellipse cx="196" cy="352" rx="13" ry="11" fill="url(#rbc)"/>
      <ellipse cx="196" cy="352" rx="6" ry="5" fill="#6B121A" opacity="0.4"/>
    </g>

    <!-- tiny count markers on a few cells (quantified) -->
    <g fill="#3A0A0E" opacity="0.55" font-family="monospace" font-size="7">
      <text x="340" y="248" text-anchor="middle">+</text>
      <text x="168" y="333" text-anchor="middle">+</text>
    </g>

    <!-- count annotation bottom -->
    <text font-family="monospace" font-size="8" fill="#6B121A" opacity="0.5"
      text-anchor="middle" x="250" y="418">n RBC · Ø µm</text>

  </g>

  <!-- Hex border — imaging group blue -->
  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"
    fill="none" stroke="#185FA5" stroke-width="11" stroke-linejoin="round"/>
  <polygon points="250,44 441,153 441,367 250,476 59,367 59,153"
    fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>
</svg>
